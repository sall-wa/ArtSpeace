<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabung Klub - Klub Musik Nada Bebas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>KLUB MUSIK NADA BEBAS</h1>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="anggota.html">Daftar Personil</a>
            <a href="galeri.html">Galeri</a>
            <a href="daftar.html">Gabung Klub</a>
        </nav>
    </header>

    <main>
        <h2>Formulir Pendaftaran Anggota Baru</h2>
        <p style="color: #b0b0b0;">Isi data diri di bawah ini jika kamu siap untuk naik panggung bersama kami:</p>

        <form action="#" method="POST">
            <fieldset>
                <legend>Data Calon Musisi</legend>

                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkapmu" required>

                <label for="panggung">Nama Panggung:</label>
                <input type="text" id="panggung" name="panggung" placeholder="Contoh: Si Gitaris" required>

                <label for="tgl_lahir">Tanggal Lahir:</label>
                <input type="date" id="tgl_lahir" name="tgl_lahir" required>

                <label for="instrumen">Instrumen Utama:</label>
                <select id="instrumen" name="instrumen" required>
                    <option value="" disabled selected>-- Pilih Instrumen --</option>
                    <option value="vokal">Vokalis</option>
                    <option value="gitar">Gitaris</option>
                    <option value="bass">Bassis</option>
                    <option value="drum">Drummer</option>
                    <option value="piano">Pianis / Keyboardist</option>
                    <option value="lainnya">Lainnya</option>
                </select>

                <label>Level Pengalaman:</label>
                <div class="radio-group">
                    <input type="radio" id="pemula" name="level" value="pemula">
                    <label for="pemula">Pemula (Baru Belajar)</label><br>
                    
                    <input type="radio" id="menengah" name="level" value="menengah">
                    <label for="menengah">Menengah (Bisa Main Lagu)</label><br>
                    
                    <input type="radio" id="mahir" name="level" value="mahir">
                    <label for="mahir">Mahir (Siap Tampil)</label>
                </div>

                <label for="alasan">Kenapa Kamu Ingin Bergabung?</label>
                <textarea id="alasan" name="alasan" rows="4" placeholder="Ceritakan motivasimu atau lagu favoritmu..."></textarea>

                <button type="submit">Kirim Pendaftaran</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>copy; 2026 Klub Musik Nada Bebas. All Rights Reserved.</p>
    </footer>

</body>
</html>
